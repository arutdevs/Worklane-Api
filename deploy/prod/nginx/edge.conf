# Production API edge. Draft. Bind-mounted over the stock nginx-unprivileged
# default.conf. The API trusts only this container: 172.30.20.10.
# Web is 172.30.20.3. cloudflared is 172.30.20.4. Neither is a KnownProxy.
# Do not add KnownNetworks. Do not append a client-supplied forwarded-for list.
#
# real_ip_header is once per server, so the tunnel hostname and the web path
# are separate server blocks. api.example.com is a placeholder: replace it
# with the real API hostname before any start, in this file and in
# cloudflared/config.yml. A request that does not match that name uses the
# default server, which trusts X-Forwarded-For only from the Web nginx.

map $http_upgrade $connection_upgrade {
    default upgrade;
    ""      "";
}

server {
    listen 8080;
    server_name api.example.com;

    # Only the pinned tunnel container. A list or a non-IP is not adopted,
    # and $remote_addr stays 172.30.20.4 (one shared bucket, not a spoofed one).
    set_real_ip_from 172.30.20.4;
    real_ip_header CF-Connecting-IP;
    real_ip_recursive off;

    server_tokens off;
    client_max_body_size 12m;

    resolver 127.0.0.11 ipv6=off valid=10s;

    location = /nginx-health {
        access_log off;
        default_type text/plain;
        return 200 "ok\n";
    }

    location / {
        set $api_upstream http://api:8080;
        proxy_pass $api_upstream;
        proxy_http_version 1.1;
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $remote_addr;
        # The tunnel speaks HTTP. The public scheme is HTTPS. $scheme would
        # make UseHttpsRedirection loop.
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header CF-Connecting-IP "";
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
    }
}

server {
    listen 8080 default_server;
    server_name _;

    # Only the pinned Web nginx. Not 172.30.20.0/24 and not the gateway.
    set_real_ip_from 172.30.20.3;
    real_ip_header X-Forwarded-For;
    real_ip_recursive off;

    server_tokens off;
    client_max_body_size 12m;

    resolver 127.0.0.11 ipv6=off valid=10s;

    location = /nginx-health {
        access_log off;
        default_type text/plain;
        return 200 "ok\n";
    }

    location / {
        set $api_upstream http://api:8080;
        proxy_pass $api_upstream;
        proxy_http_version 1.1;
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header CF-Connecting-IP "";
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
    }
}
