# Contract for the Worklane-Web image. Not bind-mounted.
# Mounting this file over the Web image's default.conf would hide the SPA.
# The image must be nginx-unprivileged, uid 101, listen 8080, and match this
# behavior. app.example.com is a placeholder.
#
# No host port. The only expected TCP peer is cloudflared at 172.30.20.4.
# CF-Connecting-IP is adopted only from that peer, then replaced with the
# resulting single address in X-Forwarded-For. The raw header is cleared
# before it reaches the edge at 172.30.20.10.

map $http_upgrade $connection_upgrade {
    default upgrade;
    ""      "";
}

server {
    listen 8080;
    server_name app.example.com;

    set_real_ip_from 172.30.20.4;
    real_ip_header CF-Connecting-IP;
    real_ip_recursive off;

    server_tokens off;
    client_max_body_size 12m;

    location = /nginx-health {
        access_log off;
        default_type text/plain;
        return 200 "ok\n";
    }

    # The real image serves the Angular files at /. These two locations are
    # the ones that must reach the edge. proxy_pass has no URI path, so the
    # original request URI is kept.
    location /api/ {
        proxy_pass http://172.30.20.10:8080;
        proxy_http_version 1.1;
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header CF-Connecting-IP "";
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
    }

    location /hubs/ {
        proxy_pass http://172.30.20.10:8080;
        proxy_http_version 1.1;
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header CF-Connecting-IP "";
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
    }
}
