# API edge. Published on 127.0.0.1:8080. The API trusts only this container
# (172.30.20.10 on the compose proxy network) and keeps one forwarded hop.
# 172.30.20.0/24 and the gateway 172.30.20.1 are not proxies.
# KnownProxies stays this single address. The Web nginx (172.30.20.3) is not one.
#
# Direct clients of this edge: X-Forwarded-For is replaced with $remote_addr.
# Do not append $proxy_add_x_forwarded_for. A caller-supplied forwarded-for
# header must not choose the auth bucket.
#
# The Web nginx is the other public path (web:8080). It is pinned at
# 172.30.20.3 and forwards here with one client address. real_ip adopts that
# address only when the TCP peer is 172.30.20.3, so $remote_addr below is the
# browser, not the Web nginx. Any other peer keeps its socket address.
#
# CF-Connecting-IP is honoured by the API only when the TCP peer is 172.30.20.10
# and the value is a single IP. This edge does not pass the inbound header
# through: an empty value is omitted, so a client cannot pick a bucket with it.
# An edge that has verified the address itself may set that single IP.

# Only the pinned Web nginx. Not 172.30.20.0/24 and not the gateway.
set_real_ip_from 172.30.20.3;
real_ip_header X-Forwarded-For;
real_ip_recursive off;

map $http_upgrade $connection_upgrade {
    default upgrade;
    ""      "";
}

server {
    listen 8080;
    server_name _;
    server_tokens off;
    client_max_body_size 12m;

    resolver 127.0.0.11 ipv6=off valid=10s;

    location / {
        set $api_upstream http://api:8080;
        proxy_pass $api_upstream;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header CF-Connecting-IP "";
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
    }
}
