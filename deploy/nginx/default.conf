# API edge. Published on 127.0.0.1:8080. The API trusts only this container
# (172.30.20.10 on the compose proxy network) and keeps one forwarded hop.
# 172.30.20.0/24 and the gateway 172.30.20.1 are not proxies.
#
# Header contract for this edge and for the Web nginx (the only public edge):
#   proxy_set_header X-Forwarded-For $remote_addr;
# Do not append $proxy_add_x_forwarded_for. Do not map or copy $http_x_forwarded_for.
# The value is the TCP peer of the edge, one address. A caller-supplied
# X-Forwarded-For must not choose the auth bucket.
#
# CF-Connecting-IP is honoured by the API only when the TCP peer is 172.30.20.10
# and the value is a single IP. This edge does not pass the inbound header
# through: an empty value is omitted, so a client cannot pick a bucket with it.
# An edge that has verified the address itself may set that single IP.

map $http_upgrade $connection_upgrade {
    default upgrade;
    ""      "";
}

server {
    listen 8080;
    server_name _;
    server_tokens off;
    client_max_body_size 12m;

    resolver 127.0.0.11 ipv6=off valid=10s;

    location / {
        set $api_upstream http://api:8080;
        proxy_pass $api_upstream;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header CF-Connecting-IP "";
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
    }
}
