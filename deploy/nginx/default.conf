# API edge. Published on 127.0.0.1:8080. The API trusts this container's address
# on the compose `proxy` network (172.30.20.10, 172.30.20.0/24) and nobody else.
#
# Do not switch X-Forwarded-For to $proxy_add_x_forwarded_for. The API keeps one
# hop (the rightmost). Docker's published-port proxy would append its gateway,
# and every client would share that gateway's auth bucket again.
# A caller that sets X-Forwarded-For names the client. This listener is bound to
# loopback; a public deploy should overwrite the header from the real peer
# (after real_ip from Cloudflare) instead of passing the client value through.

map $http_x_forwarded_for $wl_forwarded_for {
    default $remote_addr;
    ~^\s*([0-9a-fA-F:.]+) $1;
}

map $http_upgrade $connection_upgrade {
    default upgrade;
    ""      "";
}

server {
    listen 8080;
    server_name _;
    server_tokens off;
    client_max_body_size 12m;

    resolver 127.0.0.11 ipv6=off valid=10s;

    location / {
        set $api_upstream http://api:8080;
        proxy_pass $api_upstream;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $wl_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header CF-Connecting-IP $http_cf_connecting_ip;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
    }
}
