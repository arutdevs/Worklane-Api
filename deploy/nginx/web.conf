# Public Web nginx. Not a trusted proxy.
# Pinned at 172.30.20.3 on the compose proxy network (see docker-compose.yml).
# KnownProxies stays the single API edge 172.30.20.10. This process forwards
# to that edge and does not talk to the API itself, so every web:8080 client
# is not collapsed onto this container's address.
#
# One client address, the TCP peer of this nginx:
#   proxy_set_header X-Forwarded-For $remote_addr;
# Do not append $proxy_add_x_forwarded_for. Do not copy $http_x_forwarded_for.
# The edge honours that header only from 172.30.20.3.

map $http_upgrade $connection_upgrade {
    default upgrade;
    ""      "";
}

# Same scrub as the API edge. This server proxies /hubs/ (and every other
# path) to the edge, and the default format would log ?access_token= here too.
log_format scrubbed '$remote_addr - $remote_user [$time_local] "$request_method $uri $server_protocol" '
                    '$status $body_bytes_sent "$http_referer" "$http_user_agent"';

server {
    listen 8080;
    server_name _;
    server_tokens off;
    client_max_body_size 12m;
    access_log /dev/stdout scrubbed;

    location / {
        proxy_pass http://172.30.20.10:8080;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header CF-Connecting-IP "";
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
    }
}
