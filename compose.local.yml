# Local full stack. Not a deploy file.
#   ./run-local.sh
#   docker compose -f docker-compose.yml -f compose.local.yml up --build
#
# Merged on top of docker-compose.yml. The web service stays pinned at
# 172.30.20.3 from that file. This file builds the Angular image, publishes
# it on the host, and drops the stock web.conf mount so the image's own
# nginx serves the app and proxies /api.

services:
  postgres:
    image: postgres:16-alpine
    ports: !override
      - "127.0.0.1:${WORKLANE_PG_PORT:-5434}:5432"

  migrator:
    image: worklane-api:local
    build:
      context: .
      dockerfile: src/Worklane.WebApi/Dockerfile
    command: ["--migrate-only"]
    environment:
      ASPNETCORE_ENVIRONMENT: Development
      ConnectionStrings__Default: "Host=postgres;Port=5432;Database=worklane;Username=worklane;Password=worklane"
      Jwt__Secret: "${JWT_SIGNING_KEY:?}"
      Jwt__Issuer: "Worklane"
      Jwt__Audience: "WorklaneClient"
    networks:
      - backend
    depends_on:
      postgres:
        condition: service_healthy
    restart: "no"

  api:
    image: worklane-api:local
    build:
      context: .
      dockerfile: src/Worklane.WebApi/Dockerfile
    environment:
      ASPNETCORE_ENVIRONMENT: Development
      # Invite links follow the published web port. Development allows this loopback origin.
      Frontend__BaseUrl: "http://127.0.0.1:${WORKLANE_WEB_PORT:-4200}"
    ports: !override
      - "127.0.0.1:${WORKLANE_API_PORT:-5000}:8080"
    depends_on:
      postgres:
        condition: service_healthy
      migrator:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD-SHELL", "bash -c 'echo >/dev/tcp/127.0.0.1/8080'"]
      interval: 5s
      timeout: 5s
      retries: 24
      start_period: 20s

  nginx:
    image: worklane-edge:local
    build:
      context: ./deploy/nginx
      dockerfile: Dockerfile
    # Drop the base file bind-mount. The image already contains that config.
    volumes: !reset []
    ports: !override
      - "127.0.0.1:${WORKLANE_EDGE_PORT:-8080}:8080"

  web:
    image: worklane-web:local
    build:
      context: ${WORKLANE_WEB_DIR:-../Worklane-Web}
      dockerfile: Dockerfile
    volumes: !reset []
    ports: !override
      - "127.0.0.1:${WORKLANE_WEB_PORT:-4200}:8080"
    networks:
      proxy:
        ipv4_address: 172.30.20.3
    depends_on:
      api:
        condition: service_healthy

networks:
  backend:
  proxy:
    ipam:
      config:
        - subnet: 172.30.20.0/24
