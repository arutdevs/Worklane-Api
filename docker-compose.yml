services:
  postgres:
    image: postgres:16-alpine
    networks:
      - backend
    environment:
      POSTGRES_DB: worklane
      POSTGRES_USER: worklane
      POSTGRES_PASSWORD: worklane
    volumes:
      - pgdata:/var/lib/postgresql/data
    ports:
      - "127.0.0.1:5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U worklane -d worklane"]
      interval: 5s
      timeout: 5s
      retries: 10

  api:
    build:
      context: .
      dockerfile: src/Worklane.WebApi/Dockerfile
    environment:
      ConnectionStrings__Default: "Host=postgres;Port=5432;Database=worklane;Username=worklane;Password=worklane"
      Jwt__Secret: "${JWT_SIGNING_KEY:?}"
      Jwt__Issuer: "Worklane"
      Jwt__Audience: "WorklaneClient"
      Cors__AllowedOrigins__0: "http://localhost:4200"
      Cors__AllowedOrigins__1: "http://localhost:8080"
      # Public origin of the web app. Required. Loopback is rejected outside Development.
      Frontend__BaseUrl: "${FRONTEND_BASE_URL:?}"
      # Replaces the loopback defaults. Trust only the edge container below.
      # Not the proxy-network gateway (172.30.20.1) and not 172.30.20.0/24.
      # ForwardLimit is 1 in the API. Do not set KnownNetworks.
      ForwardedHeaders__KnownProxies__0: "172.30.20.10"
      FileStorage__LocalPath: /var/worklane/attachments
      FileStorage__MaxBytes: "10485760"
    volumes:
      - attachments:/var/worklane/attachments
    ports:
      - "127.0.0.1:5000:8080"
    networks:
      - backend
      - proxy
    depends_on:
      postgres:
        condition: service_healthy

  # Loopback edge in front of the API. This fixed address is the only trusted proxy.
  # The Web nginx below is not a second KnownProxies entry. See deploy/nginx/default.conf.
  nginx:
    image: nginxinc/nginx-unprivileged:1.28-alpine
    networks:
      proxy:
        ipv4_address: 172.30.20.10
    ports:
      - "127.0.0.1:8080:8080"
    volumes:
      - ./deploy/nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - api

  # Public Web nginx (web:8080). Not the Angular app and not a trusted proxy.
  # It forwards to the edge at 172.30.20.10, so KnownProxies stays one address.
  # The pin is the only peer the edge's real_ip module accepts. See deploy/nginx/web.conf.
  web:
    image: nginxinc/nginx-unprivileged:1.28-alpine
    networks:
      proxy:
        ipv4_address: 172.30.20.3
    volumes:
      - ./deploy/nginx/web.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - nginx

volumes:
  pgdata:
  attachments:

networks:
  backend:
  proxy:
    ipam:
      config:
        - subnet: 172.30.20.0/24
