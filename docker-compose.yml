services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: worklane
      POSTGRES_USER: worklane
      POSTGRES_PASSWORD: worklane
    volumes:
      - pgdata:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U worklane -d worklane"]
      interval: 5s
      timeout: 5s
      retries: 10

  # Local S3 stand-in (RustFS). Images are pinned by index digest (amd64 + arm64).
  # A digest bump is a reviewed edit. Credentials come only from .env — see .env.example.
  s3:
    image: rustfs/rustfs:1.0.3@sha256:9ca9559533b537d10482fe923288b676ad08f92a7069d9a17327fbae3cab688b
    command: ["/data"]
    environment:
      RUSTFS_ACCESS_KEY: ${S3_ROOT_USER:?set S3_ROOT_USER in .env}
      RUSTFS_SECRET_KEY: ${S3_ROOT_PASSWORD:?set S3_ROOT_PASSWORD in .env}
    ports:
      - "127.0.0.1:9000:9000"
    volumes:
      - s3data:/data
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://127.0.0.1:9000/health >/dev/null || exit 1"]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 5s

  s3-init:
    image: rustfs/rc:v0.1.36@sha256:ab024bfebee49a750ce886b4c70963ccd9ddaa03f491704a90710641d7a26699
    depends_on:
      s3:
        condition: service_healthy
    environment:
      S3_ROOT_USER: ${S3_ROOT_USER:?set S3_ROOT_USER in .env}
      S3_ROOT_PASSWORD: ${S3_ROOT_PASSWORD:?set S3_ROOT_PASSWORD in .env}
      WL_S3_ACCESS_KEY: ${WL_S3_ACCESS_KEY:?set WL_S3_ACCESS_KEY in .env}
      WL_S3_SECRET_KEY: ${WL_S3_SECRET_KEY:?set WL_S3_SECRET_KEY in .env}
      WL_S3_BUCKET: worklane-dev-files
      # off matches Cloudflare R2 (no versioning). Set on to exercise the Spaces path.
      WL_S3_VERSIONING: ${WL_S3_VERSIONING:-off}
    entrypoint: ["/bin/sh", "-c"]
    command:
      - |
        set -e
        rc alias set local http://s3:9000 "$$S3_ROOT_USER" "$$S3_ROOT_PASSWORD"
        rc bucket create --ignore-existing "local/$$WL_S3_BUCKET"
        if [ "$$WL_S3_VERSIONING" = "on" ]; then rc bucket version enable "local/$$WL_S3_BUCKET"; fi
        rc bucket anonymous set private "local/$$WL_S3_BUCKET"
        rc bucket lifecycle rule remove "local/$$WL_S3_BUCKET" --all || true
        if [ "$$WL_S3_VERSIONING" = "on" ]; then rc bucket lifecycle rule add "local/$$WL_S3_BUCKET" --noncurrent-expiry-days 30; fi
        rc bucket lifecycle rule add "local/$$WL_S3_BUCKET" --prefix "quarantine/" --expiry-days 1
        rc bucket lifecycle rule add "local/$$WL_S3_BUCKET" --prefix "exports/" --expiry-days 7
        cat > /tmp/worklane-api.json <<JSON
        {"Version":"2012-10-17","Statement":[
          {"Effect":"Allow","Action":["s3:GetObject","s3:PutObject","s3:DeleteObject","s3:DeleteObjectVersion","s3:GetObjectVersion","s3:AbortMultipartUpload","s3:ListMultipartUploadParts"],"Resource":["arn:aws:s3:::$$WL_S3_BUCKET/*"]},
          {"Effect":"Allow","Action":["s3:ListBucket","s3:ListBucketVersions","s3:GetBucketLocation","s3:ListBucketMultipartUploads"],"Resource":["arn:aws:s3:::$$WL_S3_BUCKET"]}
        ]}
        JSON
        rc admin policy create local worklane-api /tmp/worklane-api.json || true
        rc admin user add local "$$WL_S3_ACCESS_KEY" "$$WL_S3_SECRET_KEY" || true
        rc admin policy attach local worklane-api --user "$$WL_S3_ACCESS_KEY" || true
        echo "s3-init done"
    restart: "no"

  api:
    build:
      context: .
      dockerfile: src/Worklane.WebApi/Dockerfile
    environment:
      ASPNETCORE_ENVIRONMENT: Development
      ConnectionStrings__Default: "Host=postgres;Port=5432;Database=worklane;Username=worklane;Password=worklane"
      Jwt__Secret: "6LdegTmRWObE4KGnB1uPaec64/FAnw3/jRT6iAmnPXdIVcnrFclpAzweH9k04K+3rUuydKzohCZREEGz/lmlPg=="
      Jwt__Issuer: "Worklane"
      Jwt__Audience: "WorklaneClient"
      Cors__AllowedOrigins__0: "http://localhost:4200"
      FileStorage__LocalPath: /var/worklane/attachments
      FileStorage__MaxBytes: "10485760"
      # S3 keys are wired for FS-1. The API still uses local disk until it reads them.
      # FileStorage__Provider stays unset so the process keeps the local provider.
      FileStorage__S3__ServiceUrl: "http://s3:9000"
      FileStorage__S3__Region: "us-east-1"
      FileStorage__S3__Bucket: "worklane-dev-files"
      FileStorage__S3__AccessKey: ${WL_S3_ACCESS_KEY:?set WL_S3_ACCESS_KEY in .env}
      FileStorage__S3__SecretKey: ${WL_S3_SECRET_KEY:?set WL_S3_SECRET_KEY in .env}
      FileStorage__S3__ForcePathStyle: "true"
      FileStorage__S3__RequireHttps: "false"
      FileStorage__S3__PresignExpirySeconds: "60"
      FileStorage__S3__PublicServiceUrl: "http://localhost:9000"
    volumes:
      - attachments:/var/worklane/attachments
    ports:
      - "5000:8080"
    depends_on:
      postgres:
        condition: service_healthy
      s3-init:
        condition: service_completed_successfully

  web:
    build:
      context: ./web
      dockerfile: Dockerfile
    ports:
      - "4200:80"
    depends_on:
      - api

volumes:
  pgdata:
  attachments:
  s3data:
