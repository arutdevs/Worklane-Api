name: Security

on:
  push:
    branches: [main, develop]
  # Any base branch, so a pull request stacked on another feature branch still runs these checks.
  pull_request:
  schedule:
    # Advisories get published against dependencies that have not changed, so a weekly
    # sweep catches what a push-triggered run never would.
    - cron: '0 2 * * 1'

permissions:
  contents: read

concurrency:
  group: security-${{ github.ref }}
  cancel-in-progress: true

jobs:
  nuget-audit:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      actions: write

    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - uses: actions/setup-dotnet@67a3573c9a986a3f9c594539f4ab511d57bb3ce9 # v4.3.1
        with:
          dotnet-version: '10.0.x'
          cache: true
          cache-dependency-path: '**/*.csproj'

      - name: Restore
        run: dotnet restore Worklane.slnx

      # `dotnet list package --vulnerable` reports through its output, not its exit code.
      # High and critical fail the job. Any other advisory row still fails too.
      - name: Audit NuGet packages
        run: |
          set -euo pipefail
          dotnet list package --vulnerable --include-transitive 2>&1 | tee audit.txt
          if grep -E '^[[:space:]]*>' audit.txt | grep -E -q '(^|[[:space:]])(High|Critical)([[:space:]]|$)'; then
            echo "::error::High or critical NuGet vulnerability (dotnet list package --vulnerable)"
            exit 1
          fi
          if grep -qE '^[[:space:]]*>[[:space:]]' audit.txt; then
            echo "::error::Vulnerable NuGet packages found"
            exit 1
          fi
          echo "No vulnerable NuGet packages."

  secret-scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          fetch-depth: 0

      - name: Install gitleaks
        run: |
          curl -fsSL -o /tmp/gitleaks.tar.gz https://github.com/gitleaks/gitleaks/releases/download/v8.30.1/gitleaks_8.30.1_linux_x64.tar.gz
          # Checksum from gitleaks_8.30.1_checksums.txt published with that release.
          echo '551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb  /tmp/gitleaks.tar.gz' | sha256sum -c -
          tar -xzf /tmp/gitleaks.tar.gz -C /tmp gitleaks
          sudo mv /tmp/gitleaks /usr/local/bin/gitleaks
          gitleaks version

      - name: Scan history for secrets
        run: gitleaks detect --source . --config .gitleaks.toml --redact --log-opts="--all"
