name: Security

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]
  schedule:
    # Advisories get published against dependencies that have not changed, so a weekly
    # sweep catches what a push-triggered run never would.
    - cron: '0 2 * * 1'

concurrency:
  group: security-${{ github.ref }}
  cancel-in-progress: true

jobs:
  nuget-audit:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Restore
        run: dotnet restore Worklane.slnx

      # `dotnet list package --vulnerable` reports through its output, not its exit code,
      # so the text has to be inspected for the job to fail. Advisory rows start with ">".
      - name: Audit NuGet packages
        run: |
          dotnet list package --vulnerable --include-transitive 2>&1 | tee audit.txt
          if grep -qE '^\s*>\s' audit.txt; then
            echo "::error::Vulnerable NuGet packages found"
            exit 1
          fi
          echo "No vulnerable NuGet packages."

  secret-scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install gitleaks
        run: |
          curl -fsSL -o /tmp/gitleaks.tar.gz https://github.com/gitleaks/gitleaks/releases/download/v8.30.1/gitleaks_8.30.1_linux_x64.tar.gz
          # Checksum from gitleaks_8.30.1_checksums.txt published with that release.
          echo '551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb  /tmp/gitleaks.tar.gz' | sha256sum -c -
          tar -xzf /tmp/gitleaks.tar.gz -C /tmp gitleaks
          sudo mv /tmp/gitleaks /usr/local/bin/gitleaks
          gitleaks version

      - name: Scan history for secrets
        run: gitleaks detect --source . --config .gitleaks.toml --redact --log-opts="--all"
