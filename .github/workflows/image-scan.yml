name: Image scan

on:
  push:
    branches: [main, develop]
  # Any base branch, so a pull request stacked on another feature branch still runs this check.
  pull_request:

concurrency:
  group: image-scan-${{ github.ref }}
  cancel-in-progress: true

jobs:
  base-compose-has-no-dev-s3:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Rendered deploy compose has no dev S3
        run: bash scripts/check-deploy-compose.sh

      # Fixtures are pruned out of the scan above. Each one must make that same guard exit 1.
      - name: Guard fixtures must fail
        run: |
          set -euo pipefail
          root="$(pwd)"
          found=0
          status=0
          for d in .github/guard-fixtures/*/; do
            [ -d "$d" ] || continue
            found=1
            echo "===== ${d} ====="
            if (cd "$d" && bash "$root/scripts/check-deploy-compose.sh"); then
              echo "::error::${d} passed; the guard must exit 1"
              status=1
            else
              echo "expected exit 1: ${d}"
            fi
          done
          if [ "$found" -eq 0 ]; then
            echo "::error::no guard fixtures found"
            status=1
          fi
          exit "$status"

  trivy:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        image:
          - rustfs/rustfs:1.0.3@sha256:9ca9559533b537d10482fe923288b676ad08f92a7069d9a17327fbae3cab688b
          - rustfs/rc:v0.1.36@sha256:ab024bfebee49a750ce886b4c70963ccd9ddaa03f491704a90710641d7a26699
    steps:
      # Fail when Trivy finds a CRITICAL vulnerability that already has a fix.
      # Unfixed CRITICAL findings do not fail the job: there is no image bump that clears them yet.
      - uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: ${{ matrix.image }}
          format: table
          exit-code: "1"
          severity: CRITICAL
          ignore-unfixed: true
          vuln-type: os,library
