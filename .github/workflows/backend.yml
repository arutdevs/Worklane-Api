name: Backend

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

concurrency:
  # A newer push makes an in-flight run irrelevant.
  group: backend-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Restore
        run: dotnet restore Worklane.slnx

      - name: Build
        run: dotnet build Worklane.slnx --no-restore --configuration Release

      # The suite starts a real Postgres per fixture through Testcontainers, which needs
      # a Docker daemon — ubuntu-latest runners already have one.
      - name: Test
        run: dotnet test Worklane.slnx --no-build --configuration Release --logger "trx;LogFileName=results.trx" --results-directory TestResults

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: backend-test-results
          path: TestResults/
          retention-days: 7
