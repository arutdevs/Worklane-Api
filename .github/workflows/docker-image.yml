# Build and compose-render only. This file does not deploy to staging or
# production, does not push an image, and has no GitHub deployment environment.
# A deploy workflow stays out of the repo until WL-63 is merged.

name: API image

on:
  push:
    branches: [main, develop]
    paths:
      - "src/**"
      - ".dockerignore"
      - "deploy/beta/**"
      - ".github/workflows/docker-image.yml"
  pull_request:
    branches: [main, develop]
    paths:
      - "src/**"
      - ".dockerignore"
      - "deploy/beta/**"
      - ".github/workflows/docker-image.yml"
  schedule:
    # Weekly, so a base-image break is caught even when src is quiet.
    - cron: "0 3 * * 1"

permissions:
  contents: read

concurrency:
  group: api-image-${{ github.ref }}
  cancel-in-progress: true

jobs:
  compose-config:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4

      - name: Install age
        run: sudo apt-get update -qq && sudo DEBIAN_FRONTEND=noninteractive apt-get install -y -qq age

      - name: Render the beta compose file
        run: deploy/beta/scripts/check-compose.sh

  api-image:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
      actions: write
    steps:
      - uses: actions/checkout@v4

      # Docs-only edits under deploy/beta still trigger this workflow via the
      # path filter. Skip the image build unless the image inputs changed, or
      # this is the weekly schedule.
      - name: Decide whether the image needs a build
        id: decide
        run: |
          if [[ "${{ github.event_name }}" == "schedule" ]]; then
            echo "build=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          if [[ "${{ github.event_name }}" == "pull_request" ]]; then
            base="${{ github.event.pull_request.base.sha }}"
            git fetch --no-tags --depth=1 origin "$base"
          else
            base="${{ github.event.before }}"
            if [[ "$base" =~ ^0+$ ]]; then
              echo "build=true" >> "$GITHUB_OUTPUT"
              exit 0
            fi
            git fetch --no-tags --depth=1 origin "$base" || true
          fi
          if git diff --name-only "$base" HEAD | grep -Eq '^(src/|\.dockerignore|\.github/workflows/docker-image\.yml$)'; then
            echo "build=true" >> "$GITHUB_OUTPUT"
          else
            echo "build=false" >> "$GITHUB_OUTPUT"
          fi

      - uses: docker/setup-qemu-action@v3
        if: steps.decide.outputs.build == 'true'

      - uses: docker/setup-buildx-action@v3
        if: steps.decide.outputs.build == 'true'

      # Build both architectures and do not push. The Dockerfile publishes on
      # BUILDPLATFORM, so the arm64 leg does not emulate the SDK.
      - uses: docker/build-push-action@v6
        if: steps.decide.outputs.build == 'true'
        with:
          context: .
          file: src/Worklane.WebApi/Dockerfile
          platforms: linux/amd64,linux/arm64
          push: false
          cache-from: type=gha,scope=worklane-api
          cache-to: type=gha,scope=worklane-api,mode=max
