# Build and compose-render only. This file does not deploy to staging or
# production, does not push an image, and has no GitHub deployment environment.
# The migrator Dockerfile is built the same way: both architectures, no push.
# A deploy workflow stays out of the repo until WL-63 is merged.

name: API image

on:
  push:
    branches: [main, develop]
    paths:
      - "src/**"
      - ".dockerignore"
      - "deploy/beta/**"
      - ".github/workflows/docker-image.yml"
  pull_request:
    branches: [main, develop]
    paths:
      - "src/**"
      - ".dockerignore"
      - "deploy/beta/**"
      - ".github/workflows/docker-image.yml"
  schedule:
    # Weekly, so a base-image break is caught even when src is quiet.
    - cron: "0 3 * * 1"

permissions:
  contents: read

concurrency:
  group: api-image-${{ github.ref }}
  cancel-in-progress: true

jobs:
  compose-config:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - name: Install age
        run: sudo apt-get update -qq && sudo DEBIAN_FRONTEND=noninteractive apt-get install -y -qq age

      - name: Render the beta compose file
        run: deploy/beta/scripts/check-compose.sh

  api-image:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    # contents: read only. No actions: write, so this job cannot write the
    # Actions cache and cannot push.
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      # Docs-only edits under deploy/beta still trigger this workflow via the
      # path filter. Skip the image build unless the image inputs changed, or
      # this is the weekly schedule.
      - name: Decide whether the image needs a build
        id: decide
        run: |
          if [[ "${{ github.event_name }}" == "schedule" ]]; then
            echo "build=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          if [[ "${{ github.event_name }}" == "pull_request" ]]; then
            base="${{ github.event.pull_request.base.sha }}"
            git fetch --no-tags --depth=1 origin "$base"
          else
            base="${{ github.event.before }}"
            if [[ "$base" =~ ^0+$ ]]; then
              echo "build=true" >> "$GITHUB_OUTPUT"
              exit 0
            fi
            git fetch --no-tags --depth=1 origin "$base" || true
          fi
          if git diff --name-only "$base" HEAD | grep -Eq '^(src/|\.dockerignore|deploy/beta/Dockerfile|\.github/workflows/docker-image\.yml$)'; then
            echo "build=true" >> "$GITHUB_OUTPUT"
          else
            echo "build=false" >> "$GITHUB_OUTPUT"
          fi

      - uses: docker/setup-qemu-action@c7c53464625b32c7a7e944ae62b3e17d2b600130 # v3.7.0
        if: steps.decide.outputs.build == 'true'

      - uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3.12.0
        if: steps.decide.outputs.build == 'true'

      # Build both architectures and do not push. The Dockerfile publishes on
      # BUILDPLATFORM, so the arm64 leg does not emulate the SDK.
      - uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6.19.2
        if: steps.decide.outputs.build == 'true'
        with:
          context: .
          file: src/Worklane.WebApi/Dockerfile
          platforms: linux/amd64,linux/arm64
          push: false

  migrator-image:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    # contents: read only. No actions: write, so this job cannot write the
    # Actions cache and cannot push.
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - name: Decide whether the migrator image needs a build
        id: decide
        run: |
          if [[ "${{ github.event_name }}" == "schedule" ]]; then
            echo "build=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          if [[ "${{ github.event_name }}" == "pull_request" ]]; then
            base="${{ github.event.pull_request.base.sha }}"
            git fetch --no-tags --depth=1 origin "$base"
          else
            base="${{ github.event.before }}"
            if [[ "$base" =~ ^0+$ ]]; then
              echo "build=true" >> "$GITHUB_OUTPUT"
              exit 0
            fi
            git fetch --no-tags --depth=1 origin "$base" || true
          fi
          if git diff --name-only "$base" HEAD | grep -Eq '^(src/|deploy/beta/Dockerfile|deploy/beta/migrate\.sh|\.github/workflows/docker-image\.yml$)'; then
            echo "build=true" >> "$GITHUB_OUTPUT"
          else
            echo "build=false" >> "$GITHUB_OUTPUT"
          fi

      - uses: docker/setup-qemu-action@c7c53464625b32c7a7e944ae62b3e17d2b600130 # v3.7.0
        if: steps.decide.outputs.build == 'true'

      - uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3.12.0
        if: steps.decide.outputs.build == 'true'

      - uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6.19.2
        if: steps.decide.outputs.build == 'true'
        with:
          context: .
          file: deploy/beta/Dockerfile
          platforms: linux/amd64,linux/arm64
          push: false
